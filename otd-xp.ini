# otd-xp configuration. Lines starting with # or ; are comments.
# Edit, save, and restart otd-xp.exe for changes to take effect.

# Only use a tablet whose name contains this text (leave empty = first supported tablet found)
tablet =

# Active area on the tablet, in millimetres, as seen AFTER rotation.
# Leave width/height at 0 to use the whole tablet.
area_width_mm = 58
area_height_mm = 45.24
# Centre of the area measured from the tablet's top-left corner. -1 = centre of tablet.
area_center_x_mm = 68.94
area_center_y_mm = 26.43

# 1 = shrink the area so it has the same shape as the screen (no stretching). 0 = stretch to fit.
lock_aspect = 0

# How far the tablet is turned clockwise: 0, 90, 180 or 270
rotation = 180

# Screen rectangle in pixels. Leave width/height at 0 for the whole primary screen.
screen_x = 0
screen_y = 0
screen_width = 0
screen_height = 0

# Pen tip counts as a click above this pressure (percent of the tablet's maximum)
click_threshold = 1

# What the pen side buttons do: left, right, middle or none
button1 = right
button2 = middle

# 1 = the eraser end of the pen also clicks
eraser_clicks = 0

# 1 = print every report (for troubleshooting)
debug = 0
